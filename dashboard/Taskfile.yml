version: "3"

tasks:
  check:
    desc: Run all non-mutating dashboard quality checks
    cmds:
      - pnpm run check

  lint:
    desc: Run the full dashboard Biome check
    cmds:
      - pnpm run lint

  test:
    desc: Run dashboard Biome and TypeScript checks
    cmds:
      - pnpm run test

  generate:
    desc: Generate dashboard GraphQL artifacts
    cmds:
      - pnpm run codegen

  build-check:
    desc: Build the dashboard without changing the workspace
    cmds:
      - |
        output_dir="$(mktemp -d)"
        trap 'rm -rf "$output_dir"' EXIT
        pnpm run build --outDir "$output_dir" --emptyOutDir
