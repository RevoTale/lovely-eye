name: Test Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-server:
    defaults:
      run:
        working-directory: ./server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: Install dependencies
        run: go mod tidy
      - name: Check generated code is up-to-date
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of date. Run 'go generate ./...' in the server directory and commit the changes."
            git diff
            exit 1
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: server
          args: ./...
      - name: Test
        run: go test ./...
      - name: Seed example data command
        env:
          DB_DRIVER: sqlite
          DB_DSN: file:/tmp/lovely_eye_ci.db?cache=shared&mode=rwc
          INITIAL_ADMIN_USERNAME: ci-admin
          INITIAL_ADMIN_PASSWORD: ci-password
        run: go run ./cmd/load-example-data

  validate-dashboard:
    defaults:
      run:
        working-directory: ./dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.0.2
        with:
          package-json-file: dashboard/package.json
          cache: true
          cache-dependency-path: dashboard/pnpm-lock.yaml
          install: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check generated code is up-to-date
        run: pnpm run codegen --check
      - name: Lint
        run: pnpm run lint
      - name: Architecture boundaries
        run: pnpm run check:boundaries
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:unit
      - name: Browser smoke test
        run: pnpm run test:e2e
      - name: Runtime base-path browser matrix
        run: pnpm run test:e2e:base-path
      - name: Same-origin authentication isolation
        run: pnpm run test:e2e:isolation

  validate-static-assets:
    defaults:
      run:
        working-directory: ./server/static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: Install dependencies
        run: go mod download
      - name: Build tracker asset
        run: go run build.go
      - name: Ensure generated assets are committed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated assets are out of date. Run 'task -d server/static build' and commit the results."
            git diff
            exit 1
          fi

  production-setup-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and start services
        run: docker compose -f docker/docker-compose.ci.yml up -d --build --wait
      - name: Verify health endpoint
        run: curl -sf http://localhost:8080/health
      - name: Verify dashboard is served
        run: curl -sf http://localhost:8080/ | grep -q "Privacy-friendly web analytics dashboard"
      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.ci.yml down -v

  test-migrations-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run SQLite migration tests
        run: ./scripts/test-migrations-sqlite.sh

  test-migrations-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run PostgreSQL migration tests
        run: ./scripts/test-migrations-postgres.sh
