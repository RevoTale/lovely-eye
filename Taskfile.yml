version: "3"

includes:
  dashboard:
    taskfile: ./dashboard/Taskfile.yml
    dir: ./dashboard
  docker:
    taskfile: ./docker/Taskfile.yml
    dir: ./docker
  server:
    taskfile: ./server/Taskfile.yml
    dir: ./server

tasks:
  check:
    desc: Run the complete non-mutating repository quality gate
    cmds:
      - task: dashboard:check
      - task: server:test
        vars:
          DASHBOARD_PATH: ../dashboard/dist
      - task: generate-check
      - task: build-check

  generate-check:
    desc: Verify generated artifacts without changing the workspace
    cmds:
      - ./scripts/check-generated.sh

  build-check:
    desc: Compile the dashboard and all Go packages without workspace artifacts
    cmds:
      - task: dashboard:build-check
      - task: server:build-check

  run-example-app:
    desc: Run the example Docker stack (SQLite)
    cmds:
      - task: docker:run-example-compose-app

  run-example-app-pg:
    desc: Run the example Docker stack (PostgreSQL)
    cmds:
      - task: docker:run-example-compose-app-pg

  test:
    desc: Run dashboard and server tests
    cmds:
      - echo "Running dashboard testing..."
      - task: dashboard:test
      - echo "Running server unit tests..."
      - task: server:test
        vars:
          DASHBOARD_PATH: ../dashboard/dist

  lint:
    desc: Run dashboard and server linters
    cmds:
      - task: dashboard:lint
      - task: server:lint

  generate:
    desc: Generate dashboard and server code/artifacts
    cmds:
      - task: dashboard:generate
      - task: server:generate
